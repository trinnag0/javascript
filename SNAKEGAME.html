<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE GAME</title>
    <link rel="stylesheet" href="snakestyle.css">
</head>
<body>
    <div id="game-container">
        <!-- Game Canvas -->
        <canvas id="gc" class="game-canvas" width="400" height="400"></canvas>

        <!-- Control Keys -->
        <div class="keys">
            <div class="row-up">
                <a class="up arr" onclick="Snake.action.up()">
                    <i class="chevron up"></i>
                </a>
            </div>
            <div class="row-middle">
                <a class="left arr" onclick="Snake.action.left()">
                    <i class="chevron left"></i>
                </a>
                <a class="right arr" onclick="Snake.action.right()">
                    <i class="chevron right"></i>
                </a>
            </div>
            <div class="row-down">
                <a class="down arr" onclick="Snake.action.down()">
                    <i class="chevron down"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script type="text/javascript" src="firstGAme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name ="viewport" content = "width=device-width,initial scale =1.0"> 
        <title>
        colour name acquiry
        </title>
        <style>
            body{
                position: relative;
                height:100vh;
                width: 100vw;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #box1{
                height: 300px;
                width: 300px;
                border: 2px solid rgb(0, 0, 0);
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #b1{
                color:aqua;
                background-color: rgb(0, 0, 0, 0.5);
                border-radius :20px;
            }
            #input1{
                margin:10px;
            }
        </style>
    </head>
    <body>
<div id ="box1">
<input type ="text" id ="input1" placeholder = "Enter your colour name" value=""></input>
<button id="b1">press to show</button>

</div>
    </body>
    <script>
document.getElementById('b1').addEventListener('click',function(){
    //accepting colour
    const new1 = document.getElementById('input1').value.trim();
   
    if(!new1){
        alert("Enter valid color");
        return;
    }

    if(new1){
document.getElementById('box1').style.backgroundColor = new1;

    }

});
    </script>
</html>

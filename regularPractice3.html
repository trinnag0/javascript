<!DOCTYPE html>
<html>
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" width = "device-width initial-scale= 1.0">
<title>
JS Basics
</title>
<script>
var question = "What is 10 + 10 ?";
var answer = 20;
var response = Number(prompt(question, "0"));
var message = (response === answer)
    ? "Correct: 10 + 10 = 20"
    : "Incorrect. The answer is 20.";

document.write("<h1>" + message + "</h1>");
document.write('<p id="greeting"></p>');
</script>
</head>
<body>
    
    <script>
        var enteredName = prompt("Enter your name:", "");
        var name = enteredName ? enteredName.trim() : "";
        document.getElementById("greeting").textContent =
            (name ? name : "Guest") + ", welcome to my home page!";
    </script>

    
</body>


</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" width = "device-width initial-scale= 1.0">
<title>
JS Basics
</title>
<script>
var question = "What is 10 + 10 ?";
var answer = 20;
var correct = '<img src="download (4).jpeg">';
var incorrect = '<img src="download (3).jpeg">';
var response = prompt(question,"0");
for(count = 0; count < 3; count++){
    if(response!= answer){
        confirm("Wrong,Press okay for Another chance");
        response = prompt(question,"0");
    }
    if(count == 1){
        alert("better luck next time");
    }
    else {
        alert("great! you are right");
        count = 3;
    }
}
var output = (response == answer)? correct: incorrect;
document.write("<br");
document.write(output);
</script>
</head>
<body>
    
    <script language= "Javascript">
        document.write('<img src="download (4).jpeg">');
        document.write('<h1>Greetings</h1>');
        document.write(prompt("enter your name:"," "));
        document.write("&nbsp;Welcome to my home Page")
        confirm("Do you really want to continue");

    </script>

    
</body>


</html>
